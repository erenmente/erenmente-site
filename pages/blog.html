<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Eren Mente</title>
    <meta name="description" content="Eren Mente'nin teknoloji, yazılım ve öğrenme deneyimleri hakkında blog yazıları.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/src/input.css">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@500;700;900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-brand-bg text-brand-text antialiased dark:bg-brand-dark-bg dark:text-brand-dark-text">
    <div id="nav-placeholder"></div>

    <main class="pt-40 pb-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4 tracking-tight">Blog</h1>
                <p class="text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">Öğrendiğim teknolojiler ve
                    deneyimlerim hakkında yazılar</p>
            </div>

            <!-- Category Filter -->
            <div class="flex flex-wrap justify-center gap-2 mb-8" id="blog-categories">
                <button onclick="filterBlogPosts('all')"
                    class="blog-category-btn active px-4 py-2 text-sm font-medium rounded-lg transition-all glassmorphism dark:bg-slate-800 border border-brand-border dark:border-slate-700 hover:border-brand-primary">
                    Tümü
                </button>
            </div>

            <!-- Blog Posts Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="blog-posts-grid">
                <div class="col-span-full flex items-center justify-center py-12">
                    <div class="text-center">
                        <div class="w-16 h-16 mx-auto mb-4 relative">
                            <div class="absolute inset-0 border-4 border-brand-primary/20 rounded-full"></div>
                            <div
                                class="absolute inset-0 border-4 border-transparent border-t-brand-primary rounded-full animate-spin">
                            </div>
                        </div>
                        <p class="text-slate-500 dark:text-slate-400">Yazılar yükleniyor...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="/js/pages.js"></script>
    <script type="module" src="/js/blog.js"></script>
</body>

</html>
