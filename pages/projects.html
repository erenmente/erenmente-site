<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeler | Eren Mente</title>
    <meta name="description" content="Eren Mente'nin GitHub projeleri ve açık kaynak çalışmaları.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@500;700;900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-brand-bg text-brand-text antialiased dark:bg-brand-dark-bg dark:text-brand-dark-text">
    <div id="nav-placeholder"></div>

    <main class="pt-40 pb-20">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4 tracking-tight">Projeler
                </h1>
                <p class="text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">GitHub'daki açık kaynak
                    projelerim</p>
            </div>

            <!-- Language Filter -->
            <div class="flex flex-wrap justify-center gap-2 mb-8" id="language-filter">
                <button onclick="filterProjects('all')"
                    class="filter-btn active px-4 py-2 text-sm font-medium rounded-lg transition-all glassmorphism dark:bg-slate-800 border border-brand-border dark:border-slate-700 hover:border-brand-primary">
                    Tümü
                </button>
            </div>

            <!-- Projects Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="projects-grid">
                <div class="col-span-full flex items-center justify-center py-12">
                    <div class="text-center">
                        <div class="w-16 h-16 mx-auto mb-4 relative">
                            <div class="absolute inset-0 border-4 border-brand-primary/20 rounded-full"></div>
                            <div
                                class="absolute inset-0 border-4 border-transparent border-t-brand-primary rounded-full animate-spin">
                            </div>
                        </div>
                        <p class="text-slate-500 dark:text-slate-400">Projeler GitHub'dan yükleniyor...</p>
                    </div>
                </div>
            </div>

            <!-- GitHub Profile Link -->
            <div class="mt-12 text-center">
                <a href="https://github.com/erenmente" target="_blank" rel="noopener noreferrer"
                    class="inline-flex items-center px-6 py-3 bg-slate-900 dark:bg-slate-700 text-white font-medium rounded-lg hover:bg-slate-800 dark:hover:bg-slate-600 transition-all hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            clip-rule="evenodd" />
                    </svg>
                    Tüm Projelerimi Gör
                </a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="/js/pages.js"></script>
    <script src="/js/projects.js"></script>
</body>

</html>
