<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Dynamic Meta Tags - Will be updated by JS -->
    <title>Blog | Eren Mente</title>
    <meta name="description" content="Eren Mente'nin blog yazıları - Yazılım, teknoloji ve kişisel deneyimler.">

    <!-- Open Graph -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://www.erenmente.com/blog/">
    <meta property="og:title" content="Blog | Eren Mente">
    <meta property="og:description" content="Eren Mente'nin blog yazıları">
    <meta property="og:image" content="https://www.erenmente.com/img/preview-v2.png">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/input.css">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/pages.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@500;700;900&family=Caveat:wght@600;700&family=Indie+Flower&display=swap"
        rel="stylesheet">
</head>

<body
    class="bg-brand-bg text-brand-text antialiased selection:bg-brand-primary selection:text-white dark:bg-brand-dark-bg dark:text-brand-dark-text relative transition-colors duration-300">

    <!-- Reading Progress Bar -->
    <div id="reading-progress"
        class="fixed top-0 left-0 h-1 bg-gradient-to-r from-brand-primary to-brand-accent z-[100] transition-all duration-150 w-0">
    </div>

    <!-- Navigation -->
    <nav
        class="fixed w-full z-50 glassmorphism dark:bg-brand-dark-surface/80 backdrop-blur-md border-b border-brand-border dark:border-brand-dark-border transition-all duration-300">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="text-2xl font-extrabold tracking-tight">
                    <span class="holographic-bg">erenmente</span>
                </a>

                <div class="flex items-center gap-4">
                    <a href="/#blog"
                        class="text-brand-text dark:text-slate-300 hover:text-brand-primary transition-colors px-3 py-2 rounded-md text-sm font-medium flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Tüm Yazılar
                    </a>

                    <!-- Dark Mode Toggle -->
                    <button id="theme-toggle" type="button" aria-label="Temayı Değiştir"
                        class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
                        <svg id="icon-dark" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                        <svg id="icon-light" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path
                                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                                fill-rule="evenodd" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pb-16 min-h-screen" style="padding-top: 100px;">
        <article class="max-w-3xl mx-auto px-4 sm:px-6">
            <!-- Loading State -->
            <div id="loading-state" class="flex items-center justify-center py-20">
                <div class="text-center">
                    <div class="w-16 h-16 mx-auto mb-4 relative">
                        <div class="absolute inset-0 border-4 border-brand-primary/20 rounded-full"></div>
                        <div
                            class="absolute inset-0 border-4 border-transparent border-t-brand-primary rounded-full animate-spin">
                        </div>
                    </div>
                    <p class="text-slate-500 dark:text-slate-400">Yazı yükleniyor...</p>
                </div>
            </div>

            <!-- Error State -->
            <div id="error-state" class="hidden py-20 text-center">
                <div class="text-6xl mb-4">😢</div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Yazı Bulunamadı</h1>
                <p class="text-slate-600 dark:text-slate-400 mb-6">Aradığınız blog yazısı mevcut değil veya kaldırılmış
                    olabilir.</p>
                <a href="/#blog"
                    class="inline-flex items-center px-6 py-3 bg-brand-primary text-white font-medium rounded-lg hover:bg-brand-hover transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Tüm Yazılara Dön
                </a>
            </div>

            <!-- Post Content -->
            <div id="post-content" class="hidden">
                <!-- Header -->
                <header class="mb-10">
                    <div class="mb-4">
                        <span id="post-category"
                            class="inline-block px-3 py-1 text-sm font-semibold bg-brand-primary/10 text-brand-primary rounded-full"></span>
                    </div>
                    <h1 id="post-title"
                        class="text-3xl md:text-4xl font-bold text-slate-900 dark:text-white mb-4 leading-tight"></h1>

                    <div class="flex flex-wrap items-center gap-4 text-sm text-slate-500 dark:text-slate-400">
                        <div class="flex items-center gap-2">
                            <div
                                class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-primary to-brand-accent flex items-center justify-center text-white font-bold">
                                EM</div>
                            <div>
                                <p id="post-author" class="font-medium text-slate-700 dark:text-slate-300"></p>
                                <p id="post-date" class="text-xs"></p>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- Tags -->
                <div id="post-tags" class="flex flex-wrap gap-2 mb-8"></div>

                <!-- Article Body -->
                <div id="post-body" class="prose prose-lg dark:prose-invert max-w-none
                    prose-headings:text-slate-900 dark:prose-headings:text-white
                    prose-p:text-slate-600 dark:prose-p:text-slate-300
                    prose-a:text-brand-primary hover:prose-a:text-brand-hover
                    prose-strong:text-slate-900 dark:prose-strong:text-white
                    prose-code:bg-slate-100 dark:prose-code:bg-slate-800 prose-code:px-1 prose-code:py-0.5 prose-code:rounded
                    leading-relaxed">
                </div>

                <!-- Navigation -->
                <div class="mt-16 pt-8 border-t border-brand-border dark:border-brand-dark-border">
                    <div class="flex flex-col sm:flex-row justify-between gap-4">
                        <a id="prev-post" href="#"
                            class="hidden group flex-1 p-4 rounded-xl border border-brand-border dark:border-brand-dark-border hover:border-brand-primary transition-all">
                            <span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 mb-1">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 19l-7-7 7-7" />
                                </svg>
                                Önceki Yazı
                            </span>
                            <span
                                class="font-medium text-slate-900 dark:text-white group-hover:text-brand-primary transition-colors"
                                id="prev-post-title"></span>
                        </a>
                        <a id="next-post" href="#"
                            class="hidden group flex-1 p-4 rounded-xl border border-brand-border dark:border-brand-dark-border hover:border-brand-primary transition-all text-right">
                            <span
                                class="text-xs text-slate-500 dark:text-slate-400 flex items-center justify-end gap-1 mb-1">
                                Sonraki Yazı
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 5l7 7-7 7" />
                                </svg>
                            </span>
                            <span
                                class="font-medium text-slate-900 dark:text-white group-hover:text-brand-primary transition-colors"
                                id="next-post-title"></span>
                        </a>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer
        class="bg-brand-surface/60 dark:bg-brand-dark-surface/60 backdrop-blur-sm border-t border-brand-border dark:border-brand-dark-border py-8">
        <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-slate-500 dark:text-slate-400 text-sm">&copy; <span id="year">2025</span> Eren Mente.</p>
            <div class="flex space-x-6">
                <a href="https://github.com/erenmente" target="_blank" rel="noopener noreferrer"
                    class="text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors">
                    <span class="sr-only">GitHub</span>
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            clip-rule="evenodd" />
                    </svg>
                </a>
                <a href="https://www.linkedin.com/in/erenmente/" target="_blank" rel="noopener noreferrer"
                    class="text-slate-400 hover:text-[#0077b5] transition-colors">
                    <span class="sr-only">LinkedIn</span>
                    <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <script type="module" src="/js/blog-post.js"></script>
</body>

</html>
